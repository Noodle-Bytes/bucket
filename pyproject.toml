[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "noodle-bucket"
dynamic = ["version"]
description = "Functional coverage written in Python"
authors = [
    {name = "Stuart Alldred", email = "stuartalldred@gmail.com"},
    {name = "Edward Kotarski", email = "edktrsk@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "coverage",
    "functional-coverage",
    "verification",
    "cocotb",
    "eda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "rich>=13.3.4",
    "sqlalchemy>=2.0.40",
    "click>=8.1.3",
    "pydantic>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/Noodle-Bytes/bucket"
Documentation = "https://noodle-bytes.github.io/bucket/docs/"
Repository = "https://github.com/Noodle-Bytes/bucket"
"Coverage viewer" = "https://noodle-bytes.github.io/bucket/"
Issues = "https://github.com/Noodle-Bytes/bucket/issues"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.0.1,<9",
    "pytest-cov>=4.1.0",
    "mkdocs>=1.6.0",
]

[project.scripts]
bucket = "bucket.__main__:cli"

[tool.hatch.version]
source = "vcs"

# Python-only distributions. The viewer and Electron app are not installed
# via pip; HTML generation requires a source checkout and Node.js.
[tool.hatch.build.targets.wheel]
only-include = ["bucket"]

[tool.hatch.build.targets.sdist]
only-include = [
    "bucket",
    "LICENSE",
    "README.md",
    ".git_archival.txt",
    ".gitattributes",
]
