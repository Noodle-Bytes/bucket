#
# Tag-derived release flow (overview: .github/RELEASE_AUTOMATION.md).
# Versions live in git tags, not files, and there are two release lines
# that move independently:
#
#   bucket  the Python package (PyPI)          tags v*
#   viewer  the web viewer and Electron app    tags viewer-v*
#
# When a [Patch]/[Minor]/[Major] PR merges to main, the files it changed
# decide which line(s) it releases (.github/scripts/release-components.sh)
# and the prefix decides how far each moves. Every affected line gets its
# next version computed from its own latest tag, then a tag + GitHub
# release in one step; the other line is untouched. [None] PRs skip
# cleanly. The workflow_dispatch trigger is the manual backup for cutting
# one line's release immediately (or with an exact version).
#
# Releases are created with a token minted from the noodle-bucket-releases
# GitHub App (NOODLE_APP_ID / NOODLE_APP_PRIVATE_KEY) rather than
# github.token, because tags pushed with the workflow token do not trigger
# downstream workflows — publish-pypi runs on a v* tag push and
# deploy-viewer on either line's tag push. An App private key does not
# expire, so there is no token to renew or health-check.

name: Tag Release On Merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: "Release line to cut"
        type: choice
        options: [bucket, viewer]
        default: bucket
      bump:
        description: "Version part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version X.Y.Z (overrides bump)"
        required: false
        type: string

permissions:
  contents: read
  # To list the merged PR's files.
  pull-requests: read

# Serialize releases so two near-simultaneous merges cannot both read the
# same "latest tag" and compute the same next version.
concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  tag-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Derive bump type
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION:-}" ]; then
              if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error title=Invalid version input::'${INPUT_VERSION}' is not of the form X.Y.Z"
                exit 1
              fi
              echo "bump=exact" >> "$GITHUB_OUTPUT"
              echo "exact_version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "bump=${INPUT_BUMP}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          case "$PR_TITLE" in
            \[Patch\]*)
              echo "bump=patch" >> "$GITHUB_OUTPUT"
              ;;
            \[Minor\]*)
              echo "bump=minor" >> "$GITHUB_OUTPUT"
              ;;
            \[Major\]*)
              echo "bump=major" >> "$GITHUB_OUTPUT"
              ;;
            \[None\]*)
              echo "bump=none" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Unsupported PR title prefix::Expected one of [Patch], [Minor], [Major], [None]. Got: '$PR_TITLE'"
              exit 1
              ;;
          esac

      - name: No release needed
        if: steps.bump.outputs.bump == 'none'
        run: echo "PR title starts with [None]. Skipping tag and release."

      # pull_request_target runs main's workflow file, and this checks out
      # main too, so the helper scripts below are main's copies rather than
      # anything the PR branch carried.
      - name: Checkout main with full history and tags
        if: steps.bump.outputs.bump != 'none'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide which release lines the change touches
        if: steps.bump.outputs.bump != 'none'
        id: components
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMPONENT: ${{ inputs.component }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "bucket=$([ "$INPUT_COMPONENT" = "bucket" ] && echo true || echo false)"
              echo "viewer=$([ "$INPUT_COMPONENT" = "viewer" ] && echo true || echo false)"
              echo "components=${INPUT_COMPONENT}"
            } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR's file list comes from the API rather than a git diff: it
          # does not depend on the merge method or on how main moved since.
          echo "Files changed by PR #${PR_NUMBER}:"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
            | .github/scripts/release-components.sh \
            | tee -a "$GITHUB_OUTPUT"

      # pr-title-check.yml already fails a release-prefixed PR that ships in
      # neither line before it can merge, so this is only a safety net.
      - name: Nothing releasable changed
        if: steps.bump.outputs.bump != 'none' && steps.components.outputs.components == ''
        run: echo "::warning title=No release cut::The PR has a release prefix but changed no files that ship in bucket or the viewer. Use [None] for changes like this."

      # Everything below runs only when at least one line is being released.
      # "components" is empty for [None] PRs and for the case just above.

      # Mint a short-lived installation token for the noodle-bucket-releases
      # App. Minting fails loudly if NOODLE_APP_ID / NOODLE_APP_PRIVATE_KEY are
      # missing or the key is revoked, so no separate validation step is needed.
      - name: Mint noodle-bucket-releases app token
        if: steps.components.outputs.components != ''
        id: app_token
        # actions/create-github-app-token v3.1.1 (2026-04-11)
        # refs/tags/v3.1.1 -> 1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.NOODLE_APP_ID }}
          private-key: ${{ secrets.NOODLE_APP_PRIVATE_KEY }}

      - name: Compute next versions
        if: steps.components.outputs.components != ''
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          EXACT_VERSION: ${{ steps.bump.outputs.exact_version }}
          BUCKET: ${{ steps.components.outputs.bucket }}
          VIEWER: ${{ steps.components.outputs.viewer }}
        run: |
          set -euo pipefail

          # Each line bumps from its own latest tag. Outputs are
          # bucket_latest / bucket_next and viewer_latest / viewer_next.
          if [ "$BUCKET" = "true" ]; then
            .github/scripts/next-version.sh v "$BUMP" "$EXACT_VERSION" \
              | sed 's/^/bucket_/' | tee -a "$GITHUB_OUTPUT"
          fi
          if [ "$VIEWER" = "true" ]; then
            .github/scripts/next-version.sh viewer-v "$BUMP" "$EXACT_VERSION" \
              | sed 's/^/viewer_/' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Resolve release target SHA
        if: steps.components.outputs.components != ''
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$(git rev-parse HEAD)"
          else
            sha="$MERGE_SHA"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Release target SHA: ${sha}"

      - name: Create GitHub releases with generated notes
        if: steps.components.outputs.components != ''
        id: release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          BUCKET: ${{ steps.components.outputs.bucket }}
          VIEWER: ${{ steps.components.outputs.viewer }}
          BUCKET_LATEST: ${{ steps.version.outputs.bucket_latest }}
          BUCKET_NEXT: ${{ steps.version.outputs.bucket_next }}
          VIEWER_LATEST: ${{ steps.version.outputs.viewer_latest }}
          VIEWER_NEXT: ${{ steps.version.outputs.viewer_next }}
        run: |
          set -euo pipefail

          # cut_release <component> <new tag> <previous tag or empty> [gh flags...]
          cut_release() {
            local component="$1" tag="$2" previous="$3"
            shift 3

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error title=Tag already exists::${tag} already exists. Use workflow_dispatch with an explicit version if you need to move past it."
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release ${tag} already exists. Skipping create."
              return 0
            fi

            # Notes run from this line's previous tag, so bucket and viewer
            # histories do not bleed into each other's release notes.
            local -a notes_from=()
            if [ -n "$previous" ]; then
              notes_from=(--notes-start-tag "$previous")
            fi

            local url
            url="$(gh release create "$tag" \
              --target "$TARGET_SHA" \
              --title "$tag" \
              --generate-notes "${notes_from[@]}" "$@")"
            echo "${component}_url=${url}" >> "$GITHUB_OUTPUT"
            echo "Created ${component} release ${tag}: ${url}"
          }

          if [ "$BUCKET" = "true" ]; then
            cut_release bucket "$BUCKET_NEXT" "$BUCKET_LATEST"
          fi
          if [ "$VIEWER" = "true" ]; then
            # Viewer releases never take the repository's "Latest" badge, so
            # it always points at the newest noodle-bucket (PyPI) release.
            cut_release viewer "$VIEWER_NEXT" "$VIEWER_LATEST" --latest=false
          fi

      - name: Comment on source PR
        if: github.event_name == 'pull_request_target' && (steps.release.outputs.bucket_url != '' || steps.release.outputs.viewer_url != '')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUCKET_NEXT: ${{ steps.version.outputs.bucket_next }}
          BUCKET_URL: ${{ steps.release.outputs.bucket_url }}
          VIEWER_NEXT: ${{ steps.version.outputs.viewer_next }}
          VIEWER_URL: ${{ steps.release.outputs.viewer_url }}
        run: |
          set -euo pipefail
          if [ -n "$BUCKET_URL" ]; then
            gh pr comment "$PR_NUMBER" --body "🪣 Shipped in [${BUCKET_NEXT}](${BUCKET_URL})"
          fi
          if [ -n "$VIEWER_URL" ]; then
            gh pr comment "$PR_NUMBER" --body "🪣 Viewer shipped in [${VIEWER_NEXT}](${VIEWER_URL})"
          fi
