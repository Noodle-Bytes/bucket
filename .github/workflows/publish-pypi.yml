#
# Publish the Python package. A v* tag push uploads to production PyPI;
# TestPyPI is opt-in via workflow_dispatch (target=testpypi). Only plain
# x.y.z versions are uploaded: an untagged commit builds as x.y.z.devN+gSHA,
# and the indexes reject local version segments, so those runs build and
# verify but skip publishing. Re-running a tag is a no-op: the target index
# is queried first and the upload is skipped if it already has that version.
# To rehearse against TestPyPI without cutting a tag, dispatch with
# target=testpypi and test_version=0.0.1.
# Operator setup: .github/RELEASE_AUTOMATION.md.

name: Publish to PyPI

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to. Tag pushes go to pypi automatically; choose testpypi to re-upload a tag there, or to rehearse with test_version."
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi
      test_version:
        description: "TestPyPI rehearsal only. Build this exact x.y.z (e.g. 0.0.1) instead of the git-derived version, to prove the upload path without cutting a tag. Leave blank for normal runs."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      already_published: ${{ steps.published.outputs.already_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags so hatch-vcs can derive the package version.
          fetch-depth: 0

      # pypi is the default target, so dispatching from a branch by mistake is
      # the easy slip. Fail before building, and name the tag they likely meant.
      - name: Reject production runs that are not on a tag
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "::error title=Production requires a tag::${GITHUB_REF} is not a v* tag, so there is no releasable version to publish.${tag:+ The most recent tag is ${tag}.} Re-run with 'Use workflow from: ${tag:-<tag>}'."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply the rehearsal version override
        if: github.event_name == 'workflow_dispatch' && inputs.test_version != ''
        env:
          TEST_VERSION: ${{ inputs.test_version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${TARGET}" != "testpypi" ]; then
            echo "::error title=Rehearsal is TestPyPI-only::test_version cannot be combined with target=pypi."
            exit 1
          fi
          if [[ ! "${TEST_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid test_version::Expected a plain x.y.z, got '${TEST_VERSION}'."
            exit 1
          fi
          # hatch-vcs ignores SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<NAME>; only
          # the bare variable has any effect.
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${TEST_VERSION}" >> "$GITHUB_ENV"
          echo "::notice title=Rehearsal build::Building ${TEST_VERSION} instead of the git-derived version. This is a dry run of the upload path, not a release."

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distributions are Python-only
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          wheel_names = ZipFile(wheels[0]).namelist()
          assert any(n.startswith("bucket/") for n in wheel_names), wheel_names
          assert not any(n.startswith(("viewer/", "electron/")) for n in wheel_names), wheel_names

          sdist_names = tarfile.open(sdists[0]).getnames()
          assert not any("/viewer/" in n or n.endswith("/viewer") for n in sdist_names), sdist_names
          assert not any("/electron/" in n or n.endswith("/electron") for n in sdist_names), sdist_names
          PY

      - name: Decide whether this version is publishable
        id: version
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib; print(next(pathlib.Path("dist").glob("*.whl")).name.split("-")[1])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Built ${version}, a plain x.y.z release."
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Built ${version}, which is not a plain x.y.z release."
          fi

      - name: Check the target index
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
        run: |
          set -euo pipefail
          if [ "${TARGET}" = "pypi" ]; then host="pypi.org"; else host="test.pypi.org"; fi

          # 404 covers both "project does not exist yet" and "version not
          # uploaded", which are the same answer for our purposes. Anything
          # else is a broken check rather than a licence to guess.
          index_has() {
            local code
            code="$(curl -sS --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' \
              "https://${host}/pypi/noodle-bucket/$1/json")"
            case "${code}" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "::error title=Index check failed::Unexpected HTTP ${code} from ${host} while checking $1."
                exit 1
                ;;
            esac
          }

          if [ "${IS_RELEASE}" = "true" ]; then
            if index_has "${VERSION}"; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Already published::${host} already has noodle-bucket ${VERSION}; skipping the upload."
            else
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              echo "${host} does not have ${VERSION}; publishing."
            fi
            exit 0
          fi

          # Not publishable from this ref. Name the tag that could be published
          # instead, and whether it is already there, so the operator does not
          # have to go and look it up.
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${tag}" ]; then
            echo "::notice title=Nothing to publish::Built ${VERSION} from ${GITHUB_REF}, which is not a plain x.y.z release, and the repository has no tags to fall back on."
            exit 0
          fi
          if index_has "${tag#v}"; then
            state="already on ${host}"
          else
            state="not yet on ${host}"
          fi
          echo "::notice title=Nothing to publish::Built ${VERSION} from ${GITHUB_REF}, which is not a plain x.y.z release. The most recent tag is ${tag} (${state}). To publish it, re-run with 'Use workflow from: ${tag}'."

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish-testpypi:
    needs: build
    if: >-
      needs.build.outputs.is_release == 'true' &&
      needs.build.outputs.already_published == 'false' &&
      github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/noodle-bucket/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI
        # pypa/gh-action-pypi-publish v1.14.2 (2026-07-29)
        # refs/tags/v1.14.2 -> dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: build
    # The build job already fails a non-tag dispatch targeting pypi, and only a
    # tag can produce a plain x.y.z, so reaching here means both hold.
    if: >-
      needs.build.outputs.is_release == 'true' &&
      needs.build.outputs.already_published == 'false' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/noodle-bucket/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2 (2026-07-29)
        # refs/tags/v1.14.2 -> dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            echo "No GitHub release for ${RELEASE_TAG}; skipping asset upload."
          fi
