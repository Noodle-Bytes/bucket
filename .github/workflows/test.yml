name: Tests
on: pull_request
permissions:
  contents: read
jobs:
  # Check names are "test-<os> (<python>)"; branch protection on main requires
  # every combination, so update it if the matrix changes.
  test:
    name: test-${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Full history and tags so hatch-vcs can derive the package version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        run: |
          python -m pip install --upgrade pip uv
          uv sync --extra dev

      - name: Run tests
        run: |
          uv run pytest --cov

  # Everything .pre-commit-config.yaml enforces locally (ruff lint + format,
  # import order, licence headers, docs nav footers), so it also gates merges.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      # Full history so the licence-header hook can diff against the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up uv
        run: |
          python -m pip install --upgrade pip uv
          uv sync --extra dev

      # The licence-header hook stamps the current year, so over all files it
      # would "fail" every January on untouched code. Run it the way a local
      # commit does - only on the files this PR changes - and everything else
      # over the whole tree.
      - name: Run pre-commit on all files
        run: |
          SKIP=insert-license uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check licence headers on changed files
        run: |
          uv run pre-commit run insert-license --show-diff-on-failure \
            --from-ref ${{ github.event.pull_request.base.sha }} \
            --to-ref ${{ github.event.pull_request.head.sha }}

  test-viewer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "23", "24"]
    defaults:
      run:
        working-directory: ./viewer
    steps:
      # Full history and tags so __APP_VERSION__ resolves via git describe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
